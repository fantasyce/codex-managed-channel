name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: macos-13
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: ./scripts/privacy-scan.sh --root . --history
      - run: ./scripts/package-release.sh "${GITHUB_REF_NAME}" "${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/codex-managed-channel-*.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums
        run: |
          cd dist
          sha256sum codex-managed-channel-*.tar.gz | sed 's#  \./#  #' > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/codex-managed-channel-*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
